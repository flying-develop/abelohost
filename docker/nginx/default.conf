server {
	listen 80;
	server_name _;
	root /var/www/html/public;
	index index.php;
	charset utf-8;
	server_tokens off;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location /build/ {
		try_files $uri =404;
	}

	location = /index.php {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root/index.php;
		fastcgi_pass php-fpm:9000;
	}

	location ~ \.php(?:/|$) {
		return 404;
	}

	location ~ /\. {
		deny all;
	}
}
